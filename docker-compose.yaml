# 应用服务
services:
  # 数据库服务
  postgres:
    container_name: postgres
    image: postgres:16
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      # 与 backend/env/.env.prod 的 POSTGRESQL_DB_NAME / POSTGRESQL_USER / POSTGRESQL_PASSWORD 保持一致
      POSTGRES_DB: "grapefruit"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "2328NoGxa7TkCWjmdQ8jAjIwU6eCf1Lb"
    ports:
      - "5432:5432"
    volumes:
      - ./devops/postgres/data:/var/lib/postgresql/data
      - ./devops/postgres/logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grapefruit"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - grapefruit

  # redis服务
  redis:
    container_name: redis
    image: redis:latest
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "6379:6379"
    volumes:
      - ./devops/redis/conf/redis.conf:/etc/redis/redis.conf
      - ./devops/redis/data:/data
      - ./devops/redis/logs:/var/log/redis
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a 2328NoGxa7TkCWjmdQ8jAjIwU6eCf1Lb ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - grapefruit

  # 后端服务
  backend:
    container_name: backend
    build:
      context: ./
      dockerfile: ./devops/backend/Dockerfile
    image: backend:latest
    restart: always
    # 测试服务器:以 test 环境启动(env/.env.test),SMS 走 mock 渠道并回显验证码
    command: ["python", "main.py", "run", "--env=test"]
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "8801:8801"
    volumes:
      - ./backend:/home
      # 微信支付商户证书与平台证书(只读挂载,配置见 backend/env/.env.prod)
      - ./devops/certificate:/certificate:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grapefruit
  
  # AI 生成 worker 服务(消费 ARQ 队列,调用真实模型生成并回调 backend)
  worker:
    container_name: worker
    build:
      context: ./
      dockerfile: ./devops/worker/Dockerfile
    image: worker:latest
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - ./worker:/home
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - grapefruit

  # 前端网关服务(Caddy,替代原 nginx;配置见 devops/caddy/Caddyfile)
  caddy:
    container_name: caddy
    image: caddy:2
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3(QUIC)基于 UDP,有域名开启 HTTPS 后生效,可显著改善跨洋高延迟链路
      - "443:443/udp"
    volumes:
      - ./devops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 前端构建产物(desktop/admin 的 vite outDir 直接指向 devops/caddy/data 下对应子目录)
      - ./devops/caddy/data:/usr/share/caddy
      - ./devops/caddy/logs:/var/log/caddy
    depends_on:
      - backend
    networks:
      - grapefruit

# 网络
networks:
  grapefruit:
    driver: bridge
    name: grapefruit
