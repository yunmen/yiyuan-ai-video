# 应用服务
services:
  # 数据库服务
  postgres:
    container_name: postgres
    image: postgres:16
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      # 与 backend/env/.env.prod 的 POSTGRESQL_DB_NAME / POSTGRESQL_USER / POSTGRESQL_PASSWORD 保持一致
      # 密码从项目根目录 .env 注入(docker compose 自动读取);未设置时直接报错,避免明文入库
      POSTGRES_DB: "${POSTGRES_DB:-grapefruit}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请在项目根目录 .env 中设置 POSTGRES_PASSWORD}"
    ports:
      # 仅绑定回环,避免数据库直接暴露到公网;容器间通过内网互通不受影响
      - "127.0.0.1:5432:5432"
    volumes:
      - ./devops/postgres/data:/var/lib/postgresql/data
      - ./devops/postgres/logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grapefruit"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - grapefruit

  # redis服务
  redis:
    container_name: redis
    image: redis:latest
    restart: always
    environment:
      TZ: "Asia/Shanghai"
      # 密码从项目根目录 .env 注入;redis.conf 不再内置明文密码,改由启动参数 --requirepass 传入
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在项目根目录 .env 中设置 REDIS_PASSWORD}"
    ports:
      # 仅绑定回环,避免 Redis 暴露到公网;容器间通过内网互通不受影响
      - "127.0.0.1:6379:6379"
    volumes:
      - ./devops/redis/conf/redis.conf:/etc/redis/redis.conf
      - ./devops/redis/data:/data
      - ./devops/redis/logs:/var/log/redis
    # 命令行 --requirepass 覆盖静态配置文件,密码由容器内环境变量 expansion 得到
    command: ["sh", "-c", "exec redis-server /etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - grapefruit

  # 后端服务
  backend:
    container_name: backend
    build:
      context: ./
      dockerfile: ./devops/backend/Dockerfile
    image: backend:latest
    restart: always
    # 生产环境:以 prod 环境启动(env/.env.prod),启用 _check_unsafe_defaults 启动安全校验,
    # 短信暂未开通腾讯云,走 mock 渠道并回显验证码(供内部测试)、支付走真实微信
    command: ["python", "main.py", "run", "--env=prod"]
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "8801:8801"
    volumes:
      - ./backend:/home
      # 微信支付商户证书与平台证书(只读挂载,配置见 backend/env/.env.prod)
      - ./devops/certificate:/certificate:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grapefruit
  
  # AI 生成 worker 服务(消费 ARQ 队列,调用真实模型生成并回调 backend)
  worker:
    container_name: worker
    build:
      context: ./
      dockerfile: ./devops/worker/Dockerfile
    image: worker:latest
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - ./worker:/home
      # 复刻方法论/逆推/质检等标准提示词资产(backend/skills/prompts 单一来源):
      # 挂载进容器后,worker 的 render() 才能加载 shot_reverse / creative_faithful /
      # hook_boost 等增强资产;不挂载时这些增强链路静默降级(逻辑照常跑,但"忠实/改造/爆款"
      # 透镜与开头钩子等增强不会生效)。只读挂载,避免容器误写污染资产源。
      - ./backend/skills/prompts:/home/backend_skills_prompts:ro
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - grapefruit

  # 前端网关服务(Caddy,替代原 nginx;配置见 devops/caddy/Caddyfile)
  caddy:
    container_name: caddy
    image: caddy:2
    restart: always
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3(QUIC)基于 UDP,有域名开启 HTTPS 后生效,可显著改善跨洋高延迟链路
      - "443:443/udp"
    volumes:
      - ./devops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 前端构建产物(desktop/admin 的 vite outDir 直接指向 devops/caddy/data 下对应子目录)
      - ./devops/caddy/data:/usr/share/caddy
      - ./devops/caddy/logs:/var/log/caddy
    depends_on:
      - backend
    networks:
      - grapefruit

# 网络
networks:
  grapefruit:
    driver: bridge
    name: grapefruit
