
server {
    listen       80;
    server_name  _;   # 【人工配置】改为你的域名
    root         /usr/share/nginx/html;   # 前端构建产物(desktop/dist 复制到 devops/nginx/data)
    index        index.html;

    # 前端单页应用
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口(前端基址为 /api/user,这里原样转发,不重写路径,兼容 /api/admin)
    location /api {
        proxy_pass http://backend:8801;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 404 /404.html;
        location = /40x.html {
    }
    error_page 500 502 503 504 /50x.html;
        location = /50x.html {
    }
}
